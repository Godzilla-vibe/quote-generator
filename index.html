<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --card: #16213e;
      --text: #ffffff;
      --muted: #a0a0a0;
      --accent: #0f3460;
      --accent-hover: #e94560;
      --border: #2a2a4a;
    }
    body.light {
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #555555;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 12px 50px;
      transition: background-color 0.3s, color 0.3s;
    }
    h1 { margin: 12px 0 6px; font-size: 1.85rem; text-align: center; }
    .subtitle { color: var(--muted); font-size: 0.88rem; margin-bottom: 14px; text-align: center; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 7px; justify-content: center;
      margin-bottom: 14px; max-width: 780px;
    }
    .category-btn, button {
      padding: 8px 14px; font-size: 0.88rem; border: none; border-radius: 8px;
      cursor: pointer; background-color: var(--accent); color: white;
      transition: background-color 0.2s, transform 0.15s;
    }
    .category-btn.active { background-color: var(--accent-hover); transform: scale(1.04); }
    button:hover, .category-btn:hover { background-color: var(--accent-hover); }
    #search-box {
      width: 100%; max-width: 340px; padding: 9px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      font-size: 0.95rem; margin-bottom: 14px; outline: none;
    }
    #quote-box {
      background-color: var(--card); padding: 30px 24px; border-radius: 16px;
      max-width: 700px; width: 100%; box-shadow: 0 12px 35px rgba(0,0,0,0.18);
      text-align: center; margin-bottom: 16px; min-height: 155px;
      display: flex; flex-direction: column; justify-content: center;
    }
    #quote { font-size: 1.32rem; line-height: 1.55; margin-bottom: 12px; transition: opacity 0.3s; }
    #quote.fade, #author.fade { opacity: 0; }
    #author { font-size: 0.98rem; color: var(--muted); font-style: italic; transition: opacity 0.3s; }
    #counter { font-size: 0.82rem; color: var(--muted); margin-top: 10px; }
    .bottom-buttons {
      display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-top: 6px;
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--card); border-radius: 16px; padding: 22px;
      width: 90%; max-width: 340px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .modal h3 { margin-bottom: 16px; text-align: center; font-size: 1.15rem; }
    .share-options {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .share-options button {
      padding: 12px 8px; font-size: 0.9rem;
    }
    .modal-close {
      margin-top: 16px; width: 100%; background: transparent;
      border: 1px solid var(--border); color: var(--text);
    }
    .export-options {
      display: flex; flex-direction: column; gap: 10px;
    }
    .favorites-section { margin-top: 32px; max-width: 700px; width: 100%; }
    .favorites-section h2 { font-size: 1.12rem; margin-bottom: 11px; text-align: center; }
    .fav-item {
      background: var(--card); padding: 12px 15px; border-radius: 10px;
      margin-bottom: 7px; font-size: 0.93rem; border-left: 4px solid var(--accent-hover); line-height: 1.4;
    }
    .fav-item small { color: var(--muted); display: block; margin-top: 4px; }
    .empty-fav { text-align: center; color: var(--muted); font-size: 0.93rem; }
    .shortcuts { margin-top: 22px; font-size: 0.78rem; color: var(--muted); text-align: center; }
    @media (max-width: 520px) {
      #quote { font-size: 1.12rem; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <h1>Random Quote Generator</h1>
  <p class="subtitle">Space = New Quote • C = Copy • F = Favorite</p>

  <input type="text" id="search-box" placeholder="Search quotes by keyword...">

  <div class="controls" id="categories">
    <button class="category-btn active" data-cat="all">All</button>
    <button class="category-btn" data-cat="freedom">Freedom</button>
    <button class="category-btn" data-cat="politics">Politics</button>
    <button class="category-btn" data-cat="life">Life</button>
    <button class="category-btn" data-cat="motivation">Motivation</button>
    <button class="category-btn" data-cat="leadership">Leadership</button>
    <button class="category-btn" data-cat="philosophy">Philosophy</button>
    <button class="category-btn" data-cat="witty">Witty</button>
    <button class="category-btn" data-cat="science">Science</button>
    <button class="category-btn" data-cat="courage">Courage</button>
  </div>

  <div id="quote-box">
    <p id="quote">Loading...</p>
    <p id="author"></p>
    <div id="counter"></div>
  </div>

  <div class="bottom-buttons">
    <button id="new-quote">New Quote</button>
    <button id="copy-btn">Copy</button>
    <button id="fav-btn">♥ Favorite</button>
    <button id="share-btn">Share</button>
    <button id="auto-btn">▶ Auto</button>
    <button id="theme-btn">☀️ Light</button>
    <button id="export-btn">Export</button>
  </div>

  <div class="modal-overlay" id="share-modal">
    <div class="modal">
      <h3>Share Quote</h3>
      <div class="share-options">
        <button id="share-x">X / Twitter</button>
        <button id="share-wa">WhatsApp</button>
        <button id="share-reddit">Reddit</button>
        <button id="share-fb">Facebook</button>
        <button id="share-discord">Discord</button>
        <button id="share-arattai">Arattai</button>
        <button id="share-system" style="grid-column: span 2;">Native Share (Android/iOS)</button>
      </div>
      <button class="modal-close" id="close-share">Close</button>
    </div>
  </div>

  <div class="modal-overlay" id="export-modal">
    <div class="modal">
      <h3>Export Favorites</h3>
      <div class="export-options">
        <button id="export-txt">Download as TXT</button>
        <button id="export-json">Download as JSON</button>
        <button id="export-csv">Download as CSV</button>
        <button id="export-md">Download as Markdown</button>
      </div>
      <button class="modal-close" id="close-export">Close</button>
    </div>
  </div>

  <div class="favorites-section">
    <h2>Saved Favorites</h2>
    <div id="favorites-list">
      <p class="empty-fav">No favorites yet. Click ♥ to save quotes.</p>
    </div>
  </div>

  <p class="shortcuts">Keyboard: Space = New Quote | C = Copy | F = Favorite</p>

    let currentCategory = "all";
    let currentQuote = null;
    let autoInterval = null;
    let isAuto = false;
    let favorites = JSON.parse(localStorage.getItem("quoteFavorites") || "[]");
    let searchTerm = "";

    const quoteEl = document.getElementById("quote");
    const authorEl = document.getElementById("author");
    const counterEl = document.getElementById("counter");
    const newBtn = document.getElementById("new-quote");
    const copyBtn = document.getElementById("copy-btn");
    const favBtn = document.getElementById("fav-btn");
    const shareBtn = document.getElementById("share-btn");
    const autoBtn = document.getElementById("auto-btn");
    const themeBtn = document.getElementById("theme-btn");
    const exportBtn = document.getElementById("export-btn");
    const favList = document.getElementById("favorites-list");
    const searchBox = document.getElementById("search-box");
    const shareModal = document.getElementById("share-modal");
    const exportModal = document.getElementById("export-modal");

    function getFilteredQuotes() {
      let list = currentCategory === "all" ? allQuotes : allQuotes.filter(q => q.category === currentCategory);
      if (searchTerm.trim()) {
        const term = searchTerm.toLowerCase();
        list = list.filter(q => q.text.toLowerCase().includes(term) || q.author.toLowerCase().includes(term));
      }
      return list;
    }

    function showRandomQuote() {
      const list = getFilteredQuotes();
      if (list.length === 0) {
        quoteEl.textContent = "No quotes found.";
        authorEl.textContent = "";
        counterEl.textContent = "";
        return;
      }
      quoteEl.classList.add("fade");
      authorEl.classList.add("fade");
      setTimeout(() => {
        const random = list[Math.floor(Math.random() * list.length)];
        currentQuote = random;
        quoteEl.textContent = '"' + random.text + '"';
        authorEl.textContent = "— " + random.author;
        counterEl.textContent = list.length + " quotes in this view";
        quoteEl.classList.remove("fade");
        authorEl.classList.remove("fade");
      }, 250);
    }

    function getQuoteText() {
      if (!currentQuote) return "";
      return '"' + currentQuote.text + '" — ' + currentQuote.author;
    }

    function copyQuote() {
      const text = getQuoteText();
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = "Copied!";
        setTimeout(() => copyBtn.textContent = "Copy", 1400);
      });
    }

    function toggleFavorite() {
      if (!currentQuote) return;
      const index = favorites.findIndex(f => f.text === currentQuote.text);
      if (index === -1) {
        favorites.push(currentQuote);
        favBtn.textContent = "♥ Saved";
        setTimeout(() => favBtn.textContent = "♥ Favorite", 1200);
      } else {
        favorites.splice(index, 1);
      }
      localStorage.setItem("quoteFavorites", JSON.stringify(favorites));
      renderFavorites();
    }

    function renderFavorites() {
      if (favorites.length === 0) {
        favList.innerHTML = '<p class="empty-fav">No favorites yet. Click ♥ to save quotes.</p>';
        return;
      }
      favList.innerHTML = favorites.map(f => 
        '<div class="fav-item">"' + f.text + '"<small>— ' + f.author + '</small></div>'
      ).join("");
    }

    function shareOnX() {
      const text = encodeURIComponent(getQuoteText());
      window.open("https://twitter.com/intent/tweet?text=" + text, "_blank");
      shareModal.classList.remove("show");
    }
    function shareOnWhatsApp() {
      const text = encodeURIComponent(getQuoteText());
      window.open("https://wa.me/?text=" + text, "_blank");
      shareModal.classList.remove("show");
    }
    function shareOnReddit() {
      const title = encodeURIComponent(currentQuote.text.substring(0, 80));
      const text = encodeURIComponent(getQuoteText());
      window.open("https://www.reddit.com/submit?title=" + title + "&text=" + text, "_blank");
      shareModal.classList.remove("show");
    }
    function shareOnFacebook() {
      const quote = encodeURIComponent(getQuoteText());
      window.open("https://www.facebook.com/sharer/sharer.php?quote=" + quote, "_blank");
      shareModal.classList.remove("show");
    }
    function shareOnDiscord() {
      navigator.clipboard.writeText(getQuoteText()).then(() => {
        alert("Quote copied!\n\nNow open Discord and paste it (Ctrl+V).");
        shareModal.classList.remove("show");
      });
    }
    function shareOnArattai() {
      navigator.clipboard.writeText(getQuoteText()).then(() => {
        alert("Quote copied!\n\nNow open Arattai and paste it into any chat.");
        shareModal.classList.remove("show");
      });
    }
    function shareNative() {
      if (navigator.share) {
        navigator.share({
          title: "Quote",
          text: getQuoteText()
        }).then(() => shareModal.classList.remove("show"))
          .catch(() => {});
      } else {
        alert("Native share is not supported on this device/browser.");
      }
    }

    function downloadFile(content, filename, type) {
      const blob = new Blob([content], { type: type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportTXT() {
      if (favorites.length === 0) return alert("No favorites yet.");
      const content = favorites.map(f => '"' + f.text + '" — ' + f.author).join("\n\n");
      downloadFile(content, "favorite-quotes.txt", "text/plain");
      exportModal.classList.remove("show");
    }
    function exportJSON() {
      if (favorites.length === 0) return alert("No favorites yet.");
      downloadFile(JSON.stringify(favorites, null, 2), "favorite-quotes.json", "application/json");
      exportModal.classList.remove("show");
    }
    function exportCSV() {
      if (favorites.length === 0) return alert("No favorites yet.");
      let csv = "Quote,Author,Category\n";
      favorites.forEach(f => {
        csv += '"' + f.text.replace(/"/g, '""') + '","' + f.author + '","' + f.category + '"\n';
      });
      downloadFile(csv, "favorite-quotes.csv", "text/csv");
      exportModal.classList.remove("show");
    }
    function exportMarkdown() {
      if (favorites.length === 0) return alert("No favorites yet.");
      const content = favorites.map(f => '> "' + f.text + '"\n>\n> — **' + f.author + '**\n').join("\n");
      downloadFile(content, "favorite-quotes.md", "text/markdown");
      exportModal.classList.remove("show");
    }

    function toggleAuto() {
      if (isAuto) {
        clearInterval(autoInterval);
        autoBtn.textContent = "▶ Auto";
        isAuto = false;
      } else {
        autoInterval = setInterval(showRandomQuote, 7000);
        autoBtn.textContent = "⏸ Pause";
        isAuto = true;
      }
    }

    function toggleTheme() {
      document.body.classList.toggle("light");
      const isLight = document.body.classList.contains("light");
      themeBtn.textContent = isLight ? "🌙 Dark" : "☀️ Light";
      localStorage.setItem("quoteTheme", isLight ? "light" : "dark");
    }

    newBtn.addEventListener("click", showRandomQuote);
    copyBtn.addEventListener("click", copyQuote);
    favBtn.addEventListener("click", toggleFavorite);
    autoBtn.addEventListener("click", toggleAuto);
    themeBtn.addEventListener("click", toggleTheme);

    shareBtn.addEventListener("click", () => shareModal.classList.add("show"));
    exportBtn.addEventListener("click", () => exportModal.classList.add("show"));

    document.getElementById("close-share").addEventListener("click", () => shareModal.classList.remove("show"));
    document.getElementById("close-export").addEventListener("click", () => exportModal.classList.remove("show"));

    document.getElementById("share-x").addEventListener("click", shareOnX);
    document.getElementById("share-wa").addEventListener("click", shareOnWhatsApp);
    document.getElementById("share-reddit").addEventListener("click", shareOnReddit);
    document.getElementById("share-fb").addEventListener("click", shareOnFacebook);
    document.getElementById("share-discord").addEventListener("click", shareOnDiscord);
    document.getElementById("share-arattai").addEventListener("click", shareOnArattai);
    document.getElementById("share-system").addEventListener("click", shareNative);

    document.getElementById("export-txt").addEventListener("click", exportTXT);
    document.getElementById("export-json").addEventListener("click", exportJSON);
    document.getElementById("export-csv").addEventListener("click", exportCSV);
    document.getElementById("export-md").addEventListener("click", exportMarkdown);

    searchBox.addEventListener("input", () => {
      searchTerm = searchBox.value;
      showRandomQuote();
    });

    document.querySelectorAll(".category-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.dataset.cat;
        showRandomQuote();
      });
    });

    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if (e.code === "Space") { e.preventDefault(); showRandomQuote(); }
      if (e.key.toLowerCase() === "c") copyQuote();
      if (e.key.toLowerCase() === "f") toggleFavorite();
    });

    shareModal.addEventListener("click", (e) => {
      if (e.target === shareModal) shareModal.classList.remove("show");
    });
    exportModal.addEventListener("click", (e) => {
      if (e.target === exportModal) exportModal.classList.remove("show");
    });

    if (localStorage.getItem("quoteTheme") === "light") {
      document.body.classList.add("light");
      themeBtn.textContent = "🌙 Dark";
    }
    renderFavorites();
    showRandomQuote();
  </script>
</body>
</html>
